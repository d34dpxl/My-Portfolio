<!-- SYSTEM BAR -->
<header class="sysbar" role="banner">
  <div class="sysbar-left">
    <button class="start-btn" id="start-btn" type="button"
      aria-haspopup="true" aria-expanded="false" aria-controls="start-menu">
      <span class="start-flag" aria-hidden="true">
        <span></span><span></span><span></span><span></span>
      </span>
      <span>Start</span>
    </button>
    <span class="sysbar-brand" aria-hidden="true">
      <b>SJK</b>/OS <small>v1.0</small>
    </span>
  </div>

  <div class="sysbar-mid">
    <button class="show-desk-btn" id="show-desktop" type="button"
      title="Show Desktop" aria-label="Show Desktop">
      <svg viewBox="0 0 14 14" width="12" height="12" aria-hidden="true">
        <rect x="1" y="3" width="9" height="8" fill="none" stroke="currentColor"/>
        <rect x="4" y="1" width="9" height="8" fill="#C8C8C8" stroke="currentColor"/>
      </svg>
    </button>
    <div class="taskbar" id="taskbar" role="toolbar" aria-label="Open windows"></div>
  </div>

  <div id="clock" class="sys-clock" aria-label="System time" aria-live="off"></div>
</header>

<!-- DESKTOP -->
<main id="main" class="desktop" tabindex="-1" aria-label="Desktop">
  <canvas id="wallpaper-canvas" aria-hidden="true"></canvas>
  <ul class="desk-icons" id="desk-icons" aria-label="Desktop icons"></ul>
  <div class="windows" id="windows" aria-live="polite"></div>
</main>

<!-- START MENU & CONTEXT MENU -->
<div class="start-menu" id="start-menu" hidden role="menu" aria-label="Start menu">
  <div class="start-menu-brand">
    <strong>SJK/OS</strong>
    <span>SAURAV JYOTI KALITA</span>
  </div>
</div>
<div class="context-menu" id="context-menu" hidden role="menu" aria-label="Desktop context menu"></div>
